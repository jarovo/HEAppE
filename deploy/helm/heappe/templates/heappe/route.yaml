apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "heappe.fullname" . }}-route
spec:
  host: {{ .Values.api.route.host }}
  to:
    kind: Service
    name: {{ include "heappe.fullname" . }}-api
  port:
    targetPort: http
  tls:
    insecureEdgeTerminationPolicy: Redirect
    termination: edge