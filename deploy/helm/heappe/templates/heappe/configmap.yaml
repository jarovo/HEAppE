  name: {{ include "heappe.fullname" . }}-seed-gen
  labels:
    {{- include "heappe.labels" . | nindent 4 }}
    {{- include "heappe.api.selectorLabels" . | nindent 4 }}
data:
  seed-gen.sh: |
    HASHED_PASSWORD=`echo -n "${PASSWORD}${CREATED_AT}" | sha512sum | awk '{print $1}'`

    cat > /opt/heappe/confs/seed.njson <<EOF
    {
      "MiddlewareContextSettings": {
        "AdaptorUsers": [
          {
            "Id": 1,
            "Username": "admin",
            "Password": "$HASHED_PASSWORD",
            "CreatedAt": "$CREATED_AT"
          }
        ],
        "AdaptorUserGroups": [
          {
            "Id": 1,
            "Name": "default_group",
            "Description": "Default Group",
            "ProjectId": 1
          }
        ],
        "AdaptorUserRoles": [],
        "AdaptorUserUserGroupRoles": [
          {
            "AdaptorUserId": 1,
            "AdaptorUserGroupId": 1,
            "AdaptorUserRoleId": 1,
            "CreatedAt": "2020-01-01 00:00:00",
            "ModifiedAt": null,
