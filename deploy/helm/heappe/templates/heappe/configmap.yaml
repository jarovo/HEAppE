apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "heappe.fullname" . }}-api-config
  labels:
    {{- include "heappe.labels" . | nindent 4 }}
    {{- include "heappe.api.selectorLabels" . | nindent 4 }}
data:
  appsettings.json: |-
{{ .Values.api.appsettings | toPrettyJson | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "heappe.fullname" . }}-vault-agent
data:
  vault-agent.hcl: |-
    pid_file = "/tmp/pidfile"

    auto_auth {
      method {
        type = "approle"

        config = {
          role_id_file_path = "/vault/config/role_id"
          secret_id_file_path = "/vault/config/secret_id"
          remove_secret_id_file_after_reading = false
        }
      }

      sink {
        type = "file"
        config = {
          path = "/tmp/token"
        }
      }
    }

    cache {
    }

    api_proxy {
      use_auto_auth_token = "force"
      enforce_consistency = "always"
    }

    listener "tcp" {
      address = "0.0.0.0:8100"
      tls_disable = true
    }

    vault {
      tls_skip_verify = 1
      address = "http://{{ include "heappe.fullname" . }}-vault:8200"
        retry {
        num_retries = 3
      }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "heappe.fullname" . }}-seed-gen
  labels:
    {{- include "heappe.labels" . | nindent 4 }}
    {{- include "heappe.api.selectorLabels" . | nindent 4 }}
data:
  seed-gen.sh: |
    HASHED_PASSWORD=`echo -n "${PASSWORD}${CREATED_AT}" | sha512sum | awk '{print toupper($1)}'`

    cat > /opt/heappe/confs/seed.njson <<EOF
    {
      "MiddlewareContextSettings": {
        "AdaptorUsers": [
          {
            "Id": 1,
            "Username": "admin",
            "Password": "$HASHED_PASSWORD",
            "CreatedAt": "$CREATED_AT"
          }
        ],
        "AdaptorUserGroups": [
          {
              "Id": 1,
              "Name": "admin_group",
              "Description": "Default group for admin",
              "ProjectId": null
          }
        ],
        "AdaptorUserRoles": [
          {
              "Id": 1,
              "Name": "Administrator",
              "Description": "HEAppE administrator role with access to the entire system."
          },
          {
              "Id": 2,
              "Name": "Maintainer",
              "Description": "HEAppE maintainer role for getting information about actual HEAppE status."
          },
          {
              "Id": 3,
              "Name": "Submitter",
              "Description": "Standard user, can submit and check his own jobs."
          },
          {
              "Id": 4,
              "Name": "GroupReporter",
              "Description": "Users with this role can report in assigned groups."
          },
          {
              "Id": 5,
              "Name": "Reporter",
              "Description": "Users with this role can watch other jobs in the same group."
          },
          {
              "Id": 6,
              "Name": "ManagementAdmin",
              "Description": "User with this role can create new project and use management API."
          },
          {
              "Id": 7,
              "Name": "Manager",
              "Description": "User with this role can manage command templates, can submit and check his own jobs."
          }
        ],
        "AdaptorUserUserGroupRoles": [
          {
              "AdaptorUserId": 1,
              "AdaptorUserGroupId": 1,
              "AdaptorUserRoleId": 1,
              "CreatedAt": "2026-01-01 00:00:00",
              "ModifiedAt": null,
              "IsDeleted": false
          }
        ]
      }
    }
    EOF