apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "heappe.fullname" . }}-api
  labels:
    {{- include "heappe.labels" . | nindent 4 }}
    {{- include "heappe.api.selectorLabels" . | nindent 4 }}
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "heappe.api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/heappe/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "heappe.labels" . | nindent 8 }}
        {{- include "heappe.api.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      hostAliases:
        - ip: "127.0.0.1"
          hostnames:
          - vaultagent

      initContainers:
        - name: wait-for-mssql
          image: mcr.microsoft.com/mssql-tools:latest
          env:
            - name: SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-mssql
                  key: mssql-root-password
          command:
            - sh
            - -c
            - |
              until /opt/mssql-tools/bin/sqlcmd -S {{ .Release.Name }}-mssql,1433 -U sa -P "$SA_PASSWORD" -Q "SELECT 1" >/dev/null 2>&1; do
                echo "waiting for mssql..."; sleep 5
              done
        - name: seed
          image: alpine
          env:
            - name: PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "heappe.fullname" . }}-admin
                  key: password
            - name: CREATED_AT
              valueFrom:
                secretKeyRef:
                  name: {{ include "heappe.fullname" . }}-admin
                  key: createdAt
          command: [ "/bin/sh", "/opt/scripts/seed-gen.sh"]
          volumeMounts:
            - name: config-dir
              mountPath: /opt/heappe/confs
            - name: seed-gen
              mountPath: /opt/scripts

      containers:
        # ---- HEAppE REST API container ----
        - name: heappe
          image: "{{ if .Values.global.imageRegistry }}{{ .Values.global.imageRegistry }}/{{ end }}{{ .Values.api.image.repository }}:{{ .Values.api.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.api.containerPort }}
              protocol: TCP
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "heappe.fullname" . }}-mssql
                  key: mssql-root-password
            - name: ConnectionStrings__MiddlewareContext
              value: {{ printf "Server=%s,1433;Database=HEAppEDb;User Id=sa;Password=$(DB_PASSWORD);TrustServerCertificate=True;Encrypt=Yes" (include "heappe.mssql.fullname" .) }}

            - name: ASPNETCORE_RUNTYPE_ENVIRONMENT
              value: {{ .Values.api.environmentType | quote }}
            {{- if .Values.sshAgent.enabled }}
            - name: SSH_AUTH_SOCK
              value: "/app/shared/agentsocket"
            {{- end }}
            - name: TZ
              value: "UTC"
            - name: OTEL_SERVICE_NAME
              value: "heappe[{{ .Values.otelServiceSuffixId }}]"
            - name: OTEL_SDK_DISABLED
              value: {{ if .Values.telemetry.enabled }}"false"{{ else }}"true"{{ end }}
            {{- if .Values.telemetry.enabled }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ include "heappe.otelcollector.endpoint" . | quote }}
            {{- end }}
            {{- with .Values.api.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            {{- if .Values.sshAgent.enabled }}
            - name: app-shared
              mountPath: /app/shared
            {{- end }}
            - name: logs
              mountPath: /opt/heappe/logs
            - name: sftp-temp
              mountPath: /sftp
            - name: config-dir
              mountPath: /opt/heappe/confs
            - name: api-config
              mountPath: /opt/heappe/confs/appsettings.json
              subPath: appsettings.json
            - name: db-backups
              mountPath: /opt/heappe/backups/database
            - name: keys
              mountPath: /opt/heappe/keys
            {{- with .Values.api.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.api.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.api.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.api.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}

        - name: vaultagent
          command: [ vault, agent, --config, /opt/confs/vault/agent/vault-agent.hcl ]
          image: "{{ if .Values.global.imageRegistry }}{{ .Values.global.imageRegistry }}/{{ end }}{{ .Values.vaultAgentImage.repository }}:{{ .Values.vaultAgentImage.tag }}"
          #imagePullPolicy: {{ .Values.vaultAgentImage.pullPolicy }}
          ports:
            - name: vaultagent
              containerPort: 8100
              protocol: TCP
          env:
            - name: SKIP_SETCAP
              value: "1"
          volumeMounts:
            - name: vault-agent-config
              mountPath: /opt/confs/vault/agent/vault-agent.hcl

        {{- if .Values.sshAgent.enabled }}
        # ---- SSH Agent sidecar ----
        - name: sshagent
          image: "{{ if .Values.global.imageRegistry }}{{ .Values.global.imageRegistry }}/{{ end }}{{ .Values.sshAgent.image.repository }}:{{ .Values.sshAgent.image.tag }}"
          imagePullPolicy: {{ .Values.sshAgent.image.pullPolicy }}
          env:
            - name: TZ
              value: "UTC"
            - name: SSH_AUTH_SOCK
              value: "/app/shared/agentsocket"
          volumeMounts:
            - name: app-shared
              mountPath: /app/shared
          resources:
            {{- toYaml .Values.sshAgent.resources | nindent 12 }}
        {{- end }}

      volumes:
        {{- if .Values.sshAgent.enabled }}
        - name: app-shared
          emptyDir: {}
        {{- end }}
        - name: logs
          emptyDir: {}
        - name: sftp-temp
          emptyDir: {}
        - name: config-dir
          emptyDir: {}
        - name: api-config
          configMap:
            name: {{ include "heappe.fullname" . }}-api-config
        - name: vault-agent-config
          configMap:
            name: {{ include "heappe.fullname" . }}-vault-agent
        - name: seed-gen
          configMap:
            name: {{ include "heappe.fullname" . }}-seed-gen
        - name: db-backups
          emptyDir: {}
        - name: keys
          emptyDir: {}
        {{- with .Values.api.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
