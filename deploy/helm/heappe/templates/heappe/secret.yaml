apiVersion: v1
kind: Secret
metadata:
  name: {{ include "heappe.fullname" . }}-admin
type: Opaque
{{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-admin" (include "heappe.fullname" .)) }}
data:
  password: {{ if $existing }}{{ $existing.data.password }}{{ else }}{{ randAlphaNum 24 | b64enc }}{{ end }}
  createdAt: {{ if $existing }}{{ $existing.data.createdAt }}{{ else }}{{ now | date "2006-01-02 15:04:05" | b64enc }}{{ end }}