# =============================================================================
# HEAppE Helm Chart - Default Values
# =============================================================================

nameOverride: ""
fullnameOverride: ""

# -- Global image settings
global:
  # -- Container image registry prefix (e.g., "registry.example.com/heappe")
  imageRegistry: ""
  # -- Image pull secrets
  imagePullSecrets: []

vaultAgentImage:
  repository: "registry.connect.redhat.com/hashicorp/vault"
  tag: "2.0.4-ubi"

# =============================================================================
# HEAppE REST API
# =============================================================================
api:

  admin:
    password: foo

  # -- Number of replicas
  replicaCount: 1

  image:
    repository: ghcr.io/it4innovations/heappe
    tag: ""  # defaults to Chart.appVersion
    pullPolicy: IfNotPresent

  # -- Container port
  containerPort: 8080

  # -- Environment type passed to ASPNETCORE_RUNTYPE_ENVIRONMENT
  environmentType: "Docker"

  service:
    type: ClusterIP
    port: 80

  ingress:
    enabled: false
    className: ""
    annotations: {}
      # kubernetes.io/ingress.class: nginx
      # cert-manager.io/cluster-issuer: letsencrypt
    hosts:
      - host: heappe.local
        paths:
          - path: /
            pathType: Prefix
    tls: []
    #  - secretName: heappe-tls
    #    hosts:
    #      - heappe.local

  route:
    host: heappe-testing.example.tld

  # -- HPA (Horizontal Pod Autoscaler) settings
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80

  resources:
    requests:
      memory: 512Mi
    limits:
      memory: 2Gi

  nodeSelector: {}
  tolerations: []
  affinity: {}

  # -- Additional environment variables for the HEAppE API container
  extraEnv: []

  # -- Additional volume mounts for the HEAppE API container
  extraVolumeMounts: []

  # -- Startup, liveness and readiness probes
  startupProbe:
    httpGet:
      path: /heappe/Health
      port: http
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30

  livenessProbe:
    httpGet:
      path: /heappe/Health
      port: http
    initialDelaySeconds: 15
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /heappe/Health
      port: http
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

# =============================================================================
# DataStaging API
# =============================================================================
datastaging:
  # -- Number of replicas
  replicaCount: 1

  image:
    repository: datastagingapi
    tag: ""  # defaults to Chart.appVersion
    pullPolicy: IfNotPresent

  containerPort: 8080

  environmentType: "Docker"

  service:
    type: ClusterIP
    port: 8080

  resources:
    requests:
      memory: 256Mi
    limits:
      memory: 1Gi

  nodeSelector: {}
  tolerations: []
  affinity: {}

  extraEnv: []
  extraVolumeMounts: []
  extraVolumes: []

  # -- Startup, liveness and readiness probes
  startupProbe:
    httpGet:
      path: /swagger/index.html
      port: http
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30

  livenessProbe:
    httpGet:
      path: /swagger/index.html
      port: http
    initialDelaySeconds: 15
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /swagger/index.html
      port: http
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  # -- appsettings.json for DataStagingAPI
  appSettings:
    Logging:
      LogLevel:
        Default: "Information"
        Microsoft: "Warning"
        Microsoft.AspNetCore: "Warning"
        Microsoft.Hosting.Lifetime: "Information"
    IpRateLimiting:
      EnableEndpointRateLimiting: true
      StackBlockedRequests: false
      RealIpHeader: "X-Real-IP"
      ClientIdHeader: "X-ClientId"
      HttpStatusCode: 429
      EndpointWhitelist:
        - "get:/swagger/*"
      ClientWhitelist:
        - "127.0.0.1"
      DisableRateLimitHeaders: false
      GeneralRules:
        - Endpoint: "*:/api/DataStaging/*"
          Period: "1h"
          Limit: 200000
    IpRateLimitPolicies:
      IpRules:
        - Ip: "127.0.0.1"
          Rules:
            - Endpoint: "*:/api/DataStaging/*"
              Period: "1h"
              Limit: 500000
    ApplicationAPIConfiguration:
      AllowedHosts:
        - "http://localhost:8080"
      AuthenticationParamHeaderName: "AuthKey"
      AuthenticationToken: ""
      DeploymentConfiguration:
        Name: "HEAppE DataStaging"
        Description: "Data Staging API"
        Version: "v6.5.0"
        DeployedIPAddress: "0.0.0.0"
      SwaggerConfiguration:
        Version: "v1.0.0"
        Title: "Data-Staging API"
        Description: "Data-Staging API"
        Host: "http://localhost:8080"
        HostPostfix: ""
        PrefixDocPath: "swagger"
        TermOfUsageUrl: "https://heappe.eu"
        License: "GNU General Public License v3.0"
        LicenseUrl: "https://www.gnu.org/licenses/gpl-3.0.html"
        ContactName: "IT4Innovations"
        ContactEmail: "support.heappe@it4i.cz"
        ContactUrl: "https://twitter.com/it4innovations"

# =============================================================================
# Microsoft SQL Server
# =============================================================================
mssql:
  rbac:
    create: false
    
  volumePermissions:
    enabled: false

  primary:
    hostUsers:
      enabled: false
    podSecurityContext:
      enabled: true
      fsGroup: 1001
    containerSecurityContext:
      runAsUser: 1001
      enabled: true
      runAsNonRoot: true

      # https://github.com/microsoft/mssql-docker/issues/769#issuecomment-1370324908
      capabilities:
        add:
        - NET_BIND_SERVICE

    runInitContainerAsUser: 0

# =============================================================================
# Hashicorp Vault
# =============================================================================
vault:
  global:
    openshift: true

  injector:
    enabled: false
    image:
      repository: "registry.connect.redhat.com/hashicorp/vault-k8s"
      tag: "1.7.6-ubi"

    agentImage:
      repository: "registry.connect.redhat.com/hashicorp/vault"
      tag: "2.0.4-ubi"

  server:
    authDelegator:
      enabled: true
    serviceAccount:
      create: false

    image:
      repository: "registry.connect.redhat.com/hashicorp/vault"
      tag: "2.0.4-ubi"

    readinessProbe:
      path: "/v1/sys/health?uninitcode=204"

  csi:
    image:
      repository: "registry.connect.redhat.com/hashicorp/vault-csi-provider"
      tag: "1.7.4-ubi"

    agent:
      image:
        repository: "registry.connect.redhat.com/hashicorp/vault"
        tag: "2.0.4-ubi"

# =============================================================================
# Telemetry (OpenTelemetry + Jaeger)
# =============================================================================
telemetry:
  # -- Enable telemetry components
  enabled: false

  # -- OpenTelemetry Collector
  otelCollector:
    image:
      repository: otel/opentelemetry-collector-contrib
      tag: "0.151.0"
      pullPolicy: IfNotPresent

    grpcPort: 4317

    resources:
      requests:
        memory: 256Mi
      limits:
        memory: 1Gi

    # -- Custom OTEL collector config (if empty, uses built-in)
    config: ""

  # -- Jaeger
  jaeger:
    image:
      repository: cr.jaegertracing.io/jaegertracing/jaeger
      tag: "2.17.0"
      pullPolicy: IfNotPresent

    uiPort: 16686

    resources:
      requests:
        memory: 256Mi
      limits:
        memory: 1Gi

    service:
      type: ClusterIP

# =============================================================================
# Shared settings
# =============================================================================

# -- OpenTelemetry service suffix ID for distinguishing instances
otelServiceSuffixId: "0"
